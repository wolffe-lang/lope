# lope — the pinned toolchain.
#
# wolf and lupin come from their RELEASE ARCHIVES, pinned by sha256
# digest, never from a source build: boreutils' and pelt's shape.
# `tools/fetch-toolchain` downloads the archive for this host, refuses
# on a digest mismatch, and stages the whole archive into `.wolf-bin/`
# (gitignored): the native tier needs `libwolf_rt.a` beside the driver.
#
# Identity is the FIRST line of `--version`: `tools/lib-toolchain.sh`
# refuses when it drifts from `version_line`. `rev` is information: the
# commit the tag names.
#
# ## The pin: 0.2.34 / 0.1.55 (lp01, 2026-10-21)
#
# Digests read twice from the release API (wolf-lang release 419552903,
# wolf-interp release 418932753), equal both times, and the three unix
# archives of each hashed twice after download on kasumi. The tag
# objects: v0.2.34 `38ab81cb` -> `9da7bdcf`, v0.1.55 `047184fb` ->
# `e642f263`. The wolf archive bundles wolf-std `e036bec`
# (`std/STD-REV`), which is the std pin below. 0.2.34 brings `fs_sync`
# and `fs_sync_dir` (`[os.fs.sync]`), which the store's save adopts
# (ruling #96 D9).
#
# The first pin was 0.2.33 / 0.1.54 / `cceda63` (lp00, 2026-10-19).
#
# Windows is not pinned: lope is a shell companion for unix shells.

[wolf]
version = "0.2.34"
repo = "wolffe-lang/wolf-lang"
rev = "9da7bdcf2aea9adf48df6570bedc58e16e9ef853"
version_line = "wolf 0.2.34 (wolfgang, pin 9da7bdc)"
aarch64-apple-darwin = "29c8331f5d188b00c4580bc7677b1238891c5734d00b0512df10c60eab236ee3"
x86_64-unknown-linux-gnu = "88a9dd3da1c9a0e38c08eb6e2de9c1ef04d1ed93dcf51024d8dbbb76890c1821"
aarch64-unknown-linux-gnu = "ca5cadf936dc0d4396e92733fc65e953d549f3b61f0aa354e7be2e78ea8c3ad0"

[lupin]
# The reference interpreter wolf 0.2.34 declares as its pairing:
# `wolf --version` line 2 reads "paired with lupin 0.1.55 (reference
# interpreter), pin 294d626". lupin 0.1.55 resolves neither sync
# (wolf-interp#268): it refuses at the call, and no test it runs saves.
version = "0.1.55"
repo = "wolffe-lang/wolf-interp"
rev = "e642f2630ad4c7f53740428d5cca705f2e0d295b"
version_line = "lupin 0.1.55 (wolf-interp, reference interpreter at pin 294d626)"
aarch64-apple-darwin = "2eac1cccdc8a5bec5831787604098982a7ac42e41561a037c3b5ccf0ac21741a"
x86_64-unknown-linux-gnu = "1152abc0bef65d334b94bc881a26463fac345919cc2ca07a291796e6048a8a38"
aarch64-unknown-linux-gnu = "5854ab268a835bb75749bce7601441858ac342351906a0838e8602e4edbd45d7"

[std]
# The tree is pinned by commit: git's object hash is the digest. It is
# the commit the wolf archive bundles as `std/`.
repo = "wolffe-lang/wolf-std"
rev = "e036bec318ad81ecd5a025612bc2c2adb17527f3"
