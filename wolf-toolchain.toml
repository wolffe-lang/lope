# lope — the pinned toolchain.
#
# wolf and lupin come from their RELEASE ARCHIVES, pinned by sha256
# digest, never from a source build: boreutils' and pelt's shape.
# `tools/fetch-toolchain` downloads the archive for this host, refuses
# on a digest mismatch, and stages the whole archive into `.wolf-bin/`
# (gitignored): the native tier needs `libwolf_rt.a` beside the driver.
#
# Identity is the FIRST line of `--version`: `tools/lib-toolchain.sh`
# refuses when it drifts from `version_line`. `rev` is information: the
# commit the tag names.
#
# ## The pin: 0.2.36 / 0.1.58 (r41p, 2026-10-31)
#
# Digests read twice from the release API (wolf-lang release 427033151,
# wolf-interp release 425116893), equal both times and compared with r41's
# published evidence; the linux x86-64 pair was hashed twice after
# download on hasu. The tag commits are v0.2.36 `5adf3d9` and v0.1.58
# `6240efe`. The wolf archive bundles wolf-std `78b9d3cb`
# (`std/STD-REV`), which is the std pin below.
#
# The prior pin was 0.2.35 / 0.1.56 / `2386522e` (r40p, 2026-10-23).
# Before it, 0.2.34 / 0.1.55 / `e036bec` (lp01, 2026-10-21).
# The first pin was 0.2.33 / 0.1.54 / `cceda63` (lp00, 2026-10-19).
#
# Windows is not pinned: lope is a shell companion for unix shells.

[wolf]
version = "0.2.36"
repo = "wolffe-lang/wolf-lang"
rev = "5adf3d91f75b3545ff8d38e5b6693b0b9f367a05"
version_line = "wolf 0.2.36 (wolfgang, pin 5adf3d9)"
aarch64-apple-darwin = "b79d55845f349d56789d9d1cb057ee88b5a7128d3b6dd77ca070707cfa4aa632"
x86_64-unknown-linux-gnu = "d383c74c8cd123b9d9dfaa268271d4f004294f85c2b230237d0ef07027d9500d"
aarch64-unknown-linux-gnu = "3d5bd9ef47d3d198dd67fb3f995dff3ef7b169097529fa0e7ae8524e723be3d4"

[lupin]
# The reference interpreter wolf 0.2.36 declares as its pairing:
# `wolf --version` line 2 reads "paired with lupin 0.1.58 (reference
# interpreter), pin a5378e3".
version = "0.1.58"
repo = "wolffe-lang/wolf-interp"
rev = "6240efe5570dba1a33ba6269e3ba44bae33dd972"
version_line = "lupin 0.1.58 (wolf-interp, reference interpreter at pin a5378e3)"
aarch64-apple-darwin = "c1b0277133c052892be10539062666e873e874997cbb5be300cffe2c309ec055"
x86_64-unknown-linux-gnu = "34f52792bb59bc7565e0edc1235cd47d9a6ad13d5e6528993627f2e699b62193"
aarch64-unknown-linux-gnu = "00e40fa22d99046b28357f56092075cdb3e3e36a21cc44bf04d6b46605db432c"

[std]
# The tree is pinned by commit: git's object hash is the digest. It is
# the commit the wolf archive bundles as `std/`.
repo = "wolffe-lang/wolf-std"
rev = "78b9d3cbc41d51db44d18c40b6694403644d1c83"
