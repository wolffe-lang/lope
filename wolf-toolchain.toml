# lope — the pinned toolchain.
#
# wolf and lupin come from their RELEASE ARCHIVES, pinned by sha256
# digest, never from a source build: boreutils' and pelt's shape.
# `tools/fetch-toolchain` downloads the archive for this host, refuses
# on a digest mismatch, and stages the whole archive into `.wolf-bin/`
# (gitignored): the native tier needs `libwolf_rt.a` beside the driver.
#
# Identity is the FIRST line of `--version`: `tools/lib-toolchain.sh`
# refuses when it drifts from `version_line`. `rev` is information: the
# commit the tag names.
#
# ## The pin: 0.2.40 / 0.1.62
#
# Release archive digests were read twice. The compiler archive bundles
# wolf-std `be1d10fa2798cc6bc2a1fd0b2e559e283469c9bf`.
#
# Previous pins: 0.2.36 / 0.1.58 / `78b9d3cb`, 0.2.35 / 0.1.56 /
# `2386522e`, 0.2.34 / 0.1.55 / `e036bec`, and 0.2.33 / 0.1.54 /
# `cceda63`.
#
# Windows is not pinned: lope is a shell companion for unix shells.

[wolf]
version = "0.2.40"
repo = "wolffe-lang/wolf-lang"
rev = "b333b9da8560e4e1dfd6e30099d14d98e752f9e1"
version_line = "wolf 0.2.40 (wolfgang, pin b333b9d)"
aarch64-apple-darwin = "3f18a56562fb089da05a50a612e031cd297f20a617b9e6e7ada768fbeb69e72b"
x86_64-unknown-linux-gnu = "bc2020e0b7400c18162a6072c299c65c0582ea74a0eba22aaa57ca04ae13e7e1"
aarch64-unknown-linux-gnu = "cea26eea215e7cdba60db2870c0eb4d2c5738065046ec5fe6e0eec7da55e48cd"

