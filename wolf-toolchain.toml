# lope — the pinned toolchain.
#
# wolf and lupin come from their RELEASE ARCHIVES, pinned by sha256
# digest, never from a source build: boreutils' and pelt's shape.
# `tools/fetch-toolchain` downloads the archive for this host, refuses
# on a digest mismatch, and stages the whole archive into `.wolf-bin/`
# (gitignored): the native tier needs `libwolf_rt.a` beside the driver.
#
# Identity is the FIRST line of `--version`: `tools/lib-toolchain.sh`
# refuses when it drifts from `version_line`. `rev` is information: the
# commit the tag names.
#
# ## The pin: 0.2.35 / 0.1.56 (r40p, 2026-10-23)
#
# Digests read twice from the release API (wolf-lang release 421613621,
# wolf-interp release 421458363), equal both times and compared with r40's
# published evidence. The tag commits are v0.2.35 `cf0c13d` and v0.1.56
# `28547b4`. The wolf archive bundles wolf-std `2386522e`
# (`std/STD-REV`), which is the std pin below.
#
# The prior pin was 0.2.34 / 0.1.55 / `e036bec` (lp01, 2026-10-21).
# The first pin was 0.2.33 / 0.1.54 / `cceda63` (lp00, 2026-10-19).
#
# Windows is not pinned: lope is a shell companion for unix shells.

[wolf]
version = "0.2.35"
repo = "wolffe-lang/wolf-lang"
rev = "cf0c13d38479f444b69bb8356ad5709d07eff323"
version_line = "wolf 0.2.35 (wolfgang, pin cf0c13d)"
aarch64-apple-darwin = "240b84d079b1b9a0d88681ac08fca4816f84778e2d6c94c435ceb2dd6a5f042a"
x86_64-unknown-linux-gnu = "4cc4045bbbb605c07835bc4f32685953c784eeef4cd3139a48b457dfc90dad1a"
aarch64-unknown-linux-gnu = "30ccded432264b7ddd4ebf738d4f895d12091ca604e2da4c2f831da807886f3e"

[lupin]
# The reference interpreter wolf 0.2.35 declares as its pairing:
# `wolf --version` line 2 reads "paired with lupin 0.1.56 (reference
# interpreter), pin 294d626".
version = "0.1.56"
repo = "wolffe-lang/wolf-interp"
rev = "28547b4324524d5477a6e54e4f6888462461a21f"
version_line = "lupin 0.1.56 (wolf-interp, reference interpreter at pin 294d626)"
aarch64-apple-darwin = "9133bfdbb95f6a18745439bf0b2b5280860a5bfeaf9ae038ea120a72d58f7687"
x86_64-unknown-linux-gnu = "ad703550ac4787e8e4bb26989d591a731410274d7332f2b4e8b9a64c878822cc"
aarch64-unknown-linux-gnu = "e2719ab28df566ad7b92714191bac00599fbca6c95b6b579d470497b482dd591"

[std]
# The tree is pinned by commit: git's object hash is the digest. It is
# the commit the wolf archive bundles as `std/`.
repo = "wolffe-lang/wolf-std"
rev = "2386522eb059cca5a84108562c2c0a0e72345d34"
